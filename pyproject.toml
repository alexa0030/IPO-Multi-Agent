[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipo-financial-agent"
version = "0.3.0"
description = "Evidence-grounded Hong Kong IPO prospectus financial parsing and analysis pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.24,<2",
  "pdfplumber>=0.11,<1",
  "pydantic>=2.7,<3",
  "openai>=1.40,<3",
  "langgraph>=0.2,<2",
  "openpyxl>=3.1,<4",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
ui = ["streamlit>=1.37,<2"]
search = ["ddgs>=9,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
